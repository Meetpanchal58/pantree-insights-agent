name: Refresh offline demos

on:
  push:
    branches: ["improve/reliability-evals-observability"]
    paths:
      - "scripts/build_offline_demos.py"
      - ".github/workflows/refresh-demos.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv sync --locked
      - run: uv run pantree-data download --size small
      - run: DATA_SIZE=small uv run python scripts/build_offline_demos.py
      - name: Commit regenerated demos when changed
        run: |
          if git diff --quiet -- src/pantree_insights/static/offline-demos.js; then
            echo "Offline demos already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pantree_insights/static/offline-demos.js
          git commit -m "Regenerate category-aware offline demos"
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin HEAD:"$GITHUB_REF_NAME"
