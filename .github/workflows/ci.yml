name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PANTREE_TEST_POSTGRES_DSN: postgresql://postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"

      - name: Install
        run: uv sync --locked

      - name: Lint
        run: uv run ruff check .

      - name: Cache the small shop
        uses: actions/cache@v4
        with:
          path: data/small
          key: small-shop-${{ github.run_id }}
          restore-keys: small-shop-

      - name: Download the small shop (refreshed nightly by the simulator)
        run: uv run pantree-data download --size small

      - name: Test
        run: uv run pytest -q

      - name: Validate evaluation gold SQL (no model calls)
        run: DATA_SIZE=small uv run python evals/run_eval.py --suite all --dry-run

      - name: Compiler baseline (three passes, no model calls)
        run: DATA_SIZE=small uv run python evals/baseline.py --repeats 3

      - name: Upload compiler baseline evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: compiler-baseline-${{ github.sha }}
          path: |
            evals/reports/baseline_*.json
            evals/reports/baseline_*.md
          if-no-files-found: ignore

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --package-lock=false playwright@1.62.1
      - run: npx playwright install --with-deps chromium
      - run: node tests/frontend.cjs
      - run: node tests/workspace.cjs
