name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"

      - name: Install
        run: uv sync --locked

      - name: Lint
        run: uv run ruff check .

      - name: Cache the small shop
        uses: actions/cache@v4
        with:
          path: data/small
          key: small-shop-${{ github.run_id }}
          restore-keys: small-shop-

      - name: Cache the embedding model
        uses: actions/cache@v4
        with:
          path: .cache
          key: models-${{ hashFiles('src/pantree_insights/retrieval.py') }}-${{ github.run_id }}
          restore-keys: models-${{ hashFiles('src/pantree_insights/retrieval.py') }}-

      - name: Download the small shop (refreshed nightly by the simulator)
        run: uv run pantree-data download --size small

      - name: Test
        run: uv run pytest -q

      - name: Validate evaluation gold SQL (no model calls)
        run: DATA_SIZE=small uv run python evals/run_eval.py --suite all --dry-run

      - name: Verified compiler (every gold spec returns the gold answer, no LLM)
        run: DATA_SIZE=small uv run python evals/spec_eval.py

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --package-lock=false playwright@1.62.1
      - run: npx playwright install --with-deps chromium
      - run: node tests/frontend.cjs
