name: Live model evaluation

on:
  workflow_dispatch:
    inputs:
      suite:
        description: Evaluation suite
        required: true
        default: all
        type: choice
        options: [all, holdout, regression, flow]
      repeats:
        description: Repeats
        required: true
        default: "3"

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      DATA_SIZE: full
      DAILY_BUDGET_USD: "15"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv sync --locked
      - run: uv run pantree-data download --size full
      - name: Run pinned live evaluation
        run: >
          uv run python evals/run_eval.py
          --suite ${{ inputs.suite }}
          --repeats ${{ inputs.repeats }}
          --max-cost-usd 10
          --minimum-pass-rate 0.90
          --yes
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: live-eval-${{ github.sha }}
          path: evals/reports/
          if-no-files-found: warn
