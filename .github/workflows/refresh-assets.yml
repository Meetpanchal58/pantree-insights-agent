# Temporary branch-only reproducibility job: regenerate uv.lock and model-free
# demo snapshots in GitHub Actions where dataset access is available.
name: Refresh dependencies and offline demo fixtures
on:
  push:
    branches: [fix/reliability-agent-evals-demo-cleanup]
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv lock
      - run: uv sync --locked
      - run: uv run pantree-data download --size small
      - run: DATA_SIZE=small uv run python scripts/build_offline_demos.py
      - name: Commit refreshed lock and evidence-based demo assets
        run: |
          git add uv.lock demo_runs/ src/pantree_insights/static/offline-demos.js
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Refresh locked dependencies and offline data demos"
            git push origin HEAD:${{ github.ref_name }}
          fi
