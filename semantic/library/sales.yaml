# Query library: sales. Reference queries for retrieval (not scored). Checked by tests/test_library.py.
area: sales
queries:
  - id: lib-sales-01
    question: How did net sales, orders and order value change month over month in 2026?
    variants: [month-on-month growth in net sales this year, monthly net sales with the change from the previous month]
    difficulty: hard
    tags: [trend, growth]
    metrics: [net_sales, orders, aov]
    verify:
    - metric: net_sales
      column: net_sales
      by: {month: 'date_trunc(''month'', sales.placed_at)'}
      where: [sales.placed_at >= TIMESTAMP '2026-01-01']
    - metric: orders
      column: orders
      by: {month: 'date_trunc(''month'', sales.placed_at)'}
      where: [sales.placed_at >= TIMESTAMP '2026-01-01']
    - metric: aov
      column: aov
      by: {month: 'date_trunc(''month'', sales.placed_at)'}
      where: [sales.placed_at >= TIMESTAMP '2026-01-01']
    sql: |
      WITH monthly AS (
        SELECT date_trunc('month', s.placed_at) AS month,
               SUM(CASE WHEN s.cancelled_at IS NULL THEN s.net_amount ELSE 0 END) AS net_sales,
               COUNT(DISTINCT s.order_id) AS orders,
               SUM(CASE WHEN s.cancelled_at IS NULL THEN s.net_amount ELSE 0 END)
                 / NULLIF(COUNT(DISTINCT CASE WHEN s.cancelled_at IS NULL THEN s.order_id END), 0) AS aov
        FROM sales s
        WHERE s.line_type = 'Sale' AND s.placed_at >= TIMESTAMP '2026-01-01'
        GROUP BY 1)
      SELECT month, net_sales, orders, aov,
             net_sales / NULLIF(LAG(net_sales) OVER (ORDER BY month), 0) - 1 AS net_sales_change
      FROM monthly
      ORDER BY month
    notes: The last month is incomplete; compare complete months or per-day figures.

  - id: lib-sales-02
    question: What is the cumulative realized revenue through 2026, month by month?
    variants: [year-to-date realized revenue by month, running total of revenue this year]
    difficulty: medium
    tags: [trend, running total]
    metrics: [realized_revenue]
    verify:
    - metric: realized_revenue
      column: realized_revenue
      by: {month: 'date_trunc(''month'', sales.placed_at)'}
      where: [sales.placed_at >= TIMESTAMP '2026-01-01']
    sql: |
      WITH monthly AS (
        SELECT date_trunc('month', s.placed_at) AS month,
               SUM(CASE WHEN s.delivered_at IS NOT NULL THEN s.net_amount - COALESCE(s.refund_amount, 0) ELSE 0 END)
                 AS realized_revenue
        FROM sales s
        WHERE s.line_type = 'Sale' AND s.placed_at >= TIMESTAMP '2026-01-01'
        GROUP BY 1)
      SELECT month, realized_revenue,
             SUM(realized_revenue) OVER (ORDER BY month) AS revenue_to_date
      FROM monthly
      ORDER BY month

  - id: lib-sales-03
    question: What share of net sales does each product category contribute, and how many units did each sell?
    variants: [category contribution to net sales, sales mix by category as a percentage]
    difficulty: medium
    tags: [mix, share of total]
    metrics: [net_sales, units_sold]
    verify:
    - metric: net_sales
      column: net_sales
      by: {category: product_master.category}
    - metric: units_sold
      column: units_sold
      by: {category: product_master.category}
    sql: |
      SELECT p.category,
             SUM(CASE WHEN s.cancelled_at IS NULL THEN s.net_amount ELSE 0 END) AS net_sales,
             SUM(CASE WHEN s.cancelled_at IS NULL THEN s.quantity ELSE 0 END) AS units_sold,
             SUM(CASE WHEN s.cancelled_at IS NULL THEN s.net_amount ELSE 0 END)
               / SUM(SUM(CASE WHEN s.cancelled_at IS NULL THEN s.net_amount ELSE 0 END)) OVER () AS share_of_net_sales
      FROM sales s JOIN product_master p ON p.product_id = s.product_id
      WHERE s.line_type = 'Sale'
      GROUP BY 1
      ORDER BY net_sales DESC

  - id: lib-sales-04
    question: Within each category, which three sub-categories sell the most units?
    variants: [top 3 sub-categories per category by units, best-selling sub-categories in every category]
    difficulty: hard
    tags: [ranking, top n per group]
    metrics: [units_sold]
    verify:
    - metric: units_sold
      column: units_sold
      by: {category: product_master.category, sub_category: product_master.sub_category}
      partial: true
    sql: |
      WITH units AS (
        SELECT p.category, p.sub_category,
               SUM(CASE WHEN s.cancelled_at IS NULL THEN s.quantity ELSE 0 END) AS units_sold
        FROM sales s JOIN product_master p ON p.product_id = s.product_id
        WHERE s.line_type = 'Sale'
        GROUP BY 1, 2)
      SELECT category, sub_category, units_sold,
             ROW_NUMBER() OVER (PARTITION BY category ORDER BY units_sold DESC) AS rank_in_category
      FROM units
      QUALIFY rank_in_category <= 3
      ORDER BY category, rank_in_category

  - id: lib-sales-05
    question: How many products bring in 80% of realized revenue?
    variants: [pareto of products by revenue, how concentrated is revenue across products]
    difficulty: hard
    tags: [pareto, concentration]
    metrics: [realized_revenue]
    sql: |
      WITH per_product AS (
        SELECT s.product_id,
               SUM(CASE WHEN s.delivered_at IS NOT NULL THEN s.net_amount - COALESCE(s.refund_amount, 0) ELSE 0 END)
                 AS realized_revenue
        FROM sales s
        WHERE s.line_type = 'Sale'
        GROUP BY 1),
      ranked AS (
        SELECT product_id, realized_revenue,
               SUM(realized_revenue) OVER (ORDER BY realized_revenue DESC, product_id) /
                 SUM(realized_revenue) OVER () AS cumulative_share
        FROM per_product)
      SELECT COUNT(*) FILTER (WHERE cumulative_share <= 0.8) + 1 AS products_for_80_pct,
             COUNT(*) AS products_sold,
             (COUNT(*) FILTER (WHERE cumulative_share <= 0.8) + 1) * 1.0 / COUNT(*) AS share_of_products
      FROM ranked
    notes: Products are ranked inside a CTE and only the count is returned, so no product rows are listed.

  - id: lib-sales-06
    question: How did the September to November festive season compare between 2025 and 2026 in net sales and orders?
    variants: [festive season year over year, this festive season versus last year's]
    difficulty: hard
    tags: [comparison, seasonality, period_comparison]
    metrics: [net_sales, orders]
    verify:
    - metric: net_sales
      column: net_sales
      by: {year: EXTRACT(year FROM sales.placed_at)}
      where: [((sales.placed_at >= TIMESTAMP '2025-09-01' AND sales.placed_at < TIMESTAMP '2025-11-15') OR (sales.placed_at >= TIMESTAMP '2026-09-01' AND sales.placed_at < TIMESTAMP '2026-11-15'))]
    - metric: orders
      column: orders
      by: {year: EXTRACT(year FROM sales.placed_at)}
      where: [((sales.placed_at >= TIMESTAMP '2025-09-01' AND sales.placed_at < TIMESTAMP '2025-11-15') OR (sales.placed_at >= TIMESTAMP '2026-09-01' AND sales.placed_at < TIMESTAMP '2026-11-15'))]
    sql: |
      SELECT EXTRACT(year FROM s.placed_at) AS year,
             SUM(CASE WHEN s.cancelled_at IS NULL THEN s.net_amount ELSE 0 END) AS net_sales,
             COUNT(DISTINCT s.order_id) AS orders,
             COUNT(DISTINCT CAST(s.placed_at AS DATE)) AS days_with_orders
      FROM sales s
      WHERE s.line_type = 'Sale'
        AND ((s.placed_at >= TIMESTAMP '2025-09-01' AND s.placed_at < TIMESTAMP '2025-11-15')
          OR (s.placed_at >= TIMESTAMP '2026-09-01' AND s.placed_at < TIMESTAMP '2026-11-15'))
      GROUP BY 1
      ORDER BY 1
    notes: The data ends on 2026-11-14, so both years are cut at 14 November for a like-for-like comparison.

  - id: lib-sales-07
    question: Do customers spend more per order on weekends than on weekdays?
    variants: [weekend versus weekday order value, AOV by day type weekend or weekday]
    difficulty: medium
    tags: [comparison]
    metrics: [aov, orders]
    verify:
    - metric: aov
      column: aov
      by: {day_type: 'CASE WHEN dayofweek(sales.placed_at) IN (0, 6) THEN ''Weekend'' ELSE ''Weekday'' END'}
    - metric: orders
      column: orders
      by: {day_type: 'CASE WHEN dayofweek(sales.placed_at) IN (0, 6) THEN ''Weekend'' ELSE ''Weekday'' END'}
    sql: |
      SELECT CASE WHEN dayofweek(s.placed_at) IN (0, 6) THEN 'Weekend' ELSE 'Weekday' END AS day_type,
             COUNT(DISTINCT s.order_id) AS orders,
             SUM(CASE WHEN s.cancelled_at IS NULL THEN s.net_amount ELSE 0 END)
               / NULLIF(COUNT(DISTINCT CASE WHEN s.cancelled_at IS NULL THEN s.order_id END), 0) AS aov
      FROM sales s
      WHERE s.line_type = 'Sale'
      GROUP BY 1
      ORDER BY 1

  - id: lib-sales-08
    question: Which ten brands have the best gross margin, counting only brands with real volume?
    variants: [most profitable brands by margin, brand gross margin ranking]
    difficulty: hard
    tags: [profitability, ranking]
    metrics: [gross_margin_pct]
    verify:
    - metric: gross_margin_pct
      column: gross_margin_pct
      by: {brand_name: product_master.brand_name}
      partial: true
    sql: |
      SELECT p.brand_name,
             SUM(CASE WHEN s.delivered_at IS NOT NULL AND s.refunded_at IS NULL
                      THEN s.net_amount - s.tax_amount - s.shipping_fee - s.unit_cost * s.quantity END)
               / SUM(CASE WHEN s.delivered_at IS NOT NULL AND s.refunded_at IS NULL
                          THEN s.net_amount - s.tax_amount - s.shipping_fee END) AS gross_margin_pct,
             COUNT(*) FILTER (WHERE s.delivered_at IS NOT NULL AND s.refunded_at IS NULL) AS kept_lines
      FROM sales s JOIN product_master p ON p.product_id = s.product_id
      WHERE s.line_type = 'Sale'
      GROUP BY 1
      HAVING COUNT(*) FILTER (WHERE s.delivered_at IS NOT NULL AND s.refunded_at IS NULL) >= 200
      ORDER BY gross_margin_pct DESC
      LIMIT 10

  - id: lib-sales-09
    question: Which seller cities generate the most net sales, and what type of sellers are there?
    variants: [net sales by where the seller is based, top seller locations by sales]
    difficulty: medium
    tags: [sellers, geography]
    metrics: [net_sales, orders]
    verify:
    - metric: net_sales
      column: net_sales
      by: {seller_city: sellers.city, seller_type: sellers.seller_type}
      partial: true
    - metric: orders
      column: orders
      by: {seller_city: sellers.city, seller_type: sellers.seller_type}
      partial: true
    sql: |
      SELECT se.city AS seller_city, se.seller_type,
             SUM(CASE WHEN s.cancelled_at IS NULL THEN s.net_amount ELSE 0 END) AS net_sales,
             COUNT(DISTINCT s.order_id) AS orders
      FROM sales s JOIN sellers se ON se.seller_id = s.seller_id
      WHERE s.line_type = 'Sale'
      GROUP BY 1, 2
      ORDER BY net_sales DESC
      LIMIT 15
    notes: Seller city is where the seller is based, not where the order was delivered (sales.ship_city).

  - id: lib-sales-10
    question: How much net sales and how many orders came with each type of coupon offer?
    variants: [coupon performance by offer type, sales with percentage-off versus flat-off versus bank offers]
    difficulty: hard
    tags: [coupons, promotions]
    metrics: [net_sales, orders]
    verify:
    - metric: net_sales
      column: net_sales
      by: {offer_type: promotions.offer_type}
    - metric: orders
      column: orders
      by: {offer_type: promotions.offer_type}
    sql: |
      SELECT pr.offer_type,
             COUNT(DISTINCT s.order_id) AS orders,
             SUM(CASE WHEN s.cancelled_at IS NULL THEN s.net_amount ELSE 0 END) AS net_sales,
             SUM(s.coupon_discount) AS coupon_discount
      FROM sales s
      JOIN promotions pr ON pr.code = s.coupon_code
        AND s.placed_at >= pr.start_date AND s.placed_at < pr.end_date + INTERVAL 1 DAY
      WHERE s.line_type = 'Sale'
      GROUP BY 1
      ORDER BY net_sales DESC
    notes: Coupon codes are re-issued, so the join needs the promotion's date window (join rule in schema.yaml).
      In this data every coupon sale used a Bank Offer; the % Off and Flat Off promotions were never redeemed.

  - id: lib-sales-11
    question: Within each city tier of the delivery address, how are orders split across payment methods?
    variants: [payment mix by city tier, share of COD versus UPI in each tier]
    difficulty: hard
    tags: [payments, geography, share within group]
    metrics: [orders]
    verify:
    - metric: orders
      column: orders
      by: {city_tier: customer_addresses.city_tier, payment_method: sales.payment_method}
    sql: |
      SELECT a.city_tier, s.payment_method,
             COUNT(DISTINCT s.order_id) AS orders,
             COUNT(DISTINCT s.order_id) * 1.0
               / SUM(COUNT(DISTINCT s.order_id)) OVER (PARTITION BY a.city_tier) AS share_of_tier_orders
      FROM sales s JOIN customer_addresses a ON a.address_id = s.address_id
      WHERE s.line_type = 'Sale'
      GROUP BY 1, 2
      ORDER BY 1, orders DESC

  - id: lib-sales-12
    question: How deep are discounts in each list-price band?
    variants: [discount off MRP by price range, are expensive products discounted more]
    difficulty: medium
    tags: [pricing, bands]
    metrics: [avg_discount_pct, units_sold]
    verify:
    - metric: avg_discount_pct
      column: avg_discount_pct
      by: {price_band: CASE WHEN sales.mrp < 500 THEN '1. under 500' WHEN sales.mrp < 1000 THEN '2. 500-999' WHEN sales.mrp < 2000 THEN '3. 1000-1999' WHEN sales.mrp < 4000 THEN '4. 2000-3999' ELSE '5. 4000
          and above' END}
    - metric: units_sold
      column: units_sold
      by: {price_band: CASE WHEN sales.mrp < 500 THEN '1. under 500' WHEN sales.mrp < 1000 THEN '2. 500-999' WHEN sales.mrp < 2000 THEN '3. 1000-1999' WHEN sales.mrp < 4000 THEN '4. 2000-3999' ELSE '5. 4000
          and above' END}
    sql: |
      SELECT CASE WHEN s.mrp < 500 THEN '1. under 500'
                  WHEN s.mrp < 1000 THEN '2. 500-999'
                  WHEN s.mrp < 2000 THEN '3. 1000-1999'
                  WHEN s.mrp < 4000 THEN '4. 2000-3999'
                  ELSE '5. 4000 and above' END AS price_band,
             SUM((s.mrp - s.unit_price) * s.quantity) / SUM(s.mrp * s.quantity) AS avg_discount_pct,
             SUM(CASE WHEN s.cancelled_at IS NULL THEN s.quantity ELSE 0 END) AS units_sold
      FROM sales s
      WHERE s.line_type = 'Sale'
      GROUP BY 1
      ORDER BY 1

  - id: lib-sales-13
    question: What share of orders contain more than one item, and how many items does an order have on average?
    variants: [basket size, multi-item order share, items per order]
    difficulty: medium
    tags: [basket]
    metrics: []
    sql: |
      WITH per_order AS (
        SELECT s.order_id, SUM(s.quantity) AS items
        FROM sales s
        WHERE s.line_type = 'Sale'
        GROUP BY 1)
      SELECT AVG(items) AS avg_items_per_order,
             AVG(CASE WHEN items > 1 THEN 1.0 ELSE 0 END) AS multi_item_share
      FROM per_order

  - id: lib-sales-14
    question: Which footwear sizes sell the most units, and what share of footwear units is each size?
    variants: [footwear size curve, units by shoe size]
    difficulty: medium
    tags: [size, share of total]
    metrics: [units_sold]
    verify:
    - metric: units_sold
      column: units_sold
      by: {size: product_skus.size}
      where: [product_master.category = 'Footwear']
    sql: |
      SELECT k.size,
             SUM(CASE WHEN s.cancelled_at IS NULL THEN s.quantity ELSE 0 END) AS units_sold,
             SUM(CASE WHEN s.cancelled_at IS NULL THEN s.quantity ELSE 0 END) * 1.0
               / SUM(SUM(CASE WHEN s.cancelled_at IS NULL THEN s.quantity ELSE 0 END)) OVER () AS share_of_units
      FROM sales s
      JOIN product_skus k ON k.sku_id = s.sku_id
      JOIN product_master p ON p.product_id = s.product_id
      WHERE s.line_type = 'Sale' AND p.category = 'Footwear'
      GROUP BY 1
      ORDER BY units_sold DESC

  - id: lib-sales-15
    question: How many orders per day did we get in each month of 2026?
    variants: [daily order rate by month, average orders a day each month]
    difficulty: medium
    tags: [trend, per_day_rate]
    metrics: [orders]
    verify:
    - metric: orders
      column: orders
      by: {month: 'date_trunc(''month'', sales.placed_at)'}
      where: [sales.placed_at >= TIMESTAMP '2026-01-01']
    sql: |
      SELECT date_trunc('month', s.placed_at) AS month,
             COUNT(DISTINCT s.order_id) AS orders,
             COUNT(DISTINCT CAST(s.placed_at AS DATE)) AS days,
             COUNT(DISTINCT s.order_id) * 1.0 / COUNT(DISTINCT CAST(s.placed_at AS DATE)) AS orders_per_day
      FROM sales s
      WHERE s.line_type = 'Sale' AND s.placed_at >= TIMESTAMP '2026-01-01'
      GROUP BY 1
      ORDER BY 1
    notes: Per-day rates make months of different length (and the incomplete last month) comparable.

  - id: lib-sales-16
    question: How much of our net sales comes from each affiliate partner, and what commission do we pay them?
    variants: [affiliate partner sales and commission, cost of affiliate sales by partner]
    difficulty: medium
    tags: [affiliates, marketing]
    metrics: [net_sales, orders]
    verify:
    - metric: net_sales
      column: net_sales
      by: {affiliate_partner: sales.affiliate_partner}
      where: [sales.affiliate_partner IS NOT NULL]
    - metric: orders
      column: orders
      by: {affiliate_partner: sales.affiliate_partner}
      where: [sales.affiliate_partner IS NOT NULL]
    sql: |
      SELECT s.affiliate_partner,
             COUNT(DISTINCT s.order_id) AS orders,
             SUM(CASE WHEN s.cancelled_at IS NULL THEN s.net_amount ELSE 0 END) AS net_sales,
             SUM(s.affiliate_commission) AS commission,
             SUM(s.affiliate_commission)
               / NULLIF(SUM(CASE WHEN s.cancelled_at IS NULL THEN s.net_amount ELSE 0 END), 0) AS commission_share
      FROM sales s
      WHERE s.line_type = 'Sale' AND s.affiliate_partner IS NOT NULL
      GROUP BY 1
      ORDER BY net_sales DESC

  - id: lib-sales-17
    question: How do net sales split between men's and women's products for male and female customers?
    variants: [who buys men's versus women's products, customer gender by product gender]
    difficulty: hard
    tags: [customers, product gender, customer gender]
    metrics: [net_sales]
    verify:
    - metric: net_sales
      column: net_sales
      by: {customer_gender: customers.gender, product_gender: product_master.gender}
    sql: |
      SELECT c.gender AS customer_gender, p.gender AS product_gender,
             SUM(CASE WHEN s.cancelled_at IS NULL THEN s.net_amount ELSE 0 END) AS net_sales,
             SUM(CASE WHEN s.cancelled_at IS NULL THEN s.net_amount ELSE 0 END)
               / SUM(SUM(CASE WHEN s.cancelled_at IS NULL THEN s.net_amount ELSE 0 END))
                   OVER (PARTITION BY c.gender) AS share_of_customer_gender
      FROM sales s
      JOIN customers c ON c.customer_id = s.customer_id
      JOIN product_master p ON p.product_id = s.product_id
      WHERE s.line_type = 'Sale'
      GROUP BY 1, 2
      ORDER BY 1, net_sales DESC
    notes: customers.gender is the customer's; product_master.gender is who the product is made for.

  - id: lib-sales-18
    question: How much of gross sales is lost to cancellations and discounts each month of 2026?
    variants: [gross to net sales bridge by month, from GMV to net sales this year]
    difficulty: medium
    tags: [trend, bridge]
    metrics: [gross_sales, net_sales]
    verify:
    - metric: gross_sales
      column: gross_sales
      by: {month: 'date_trunc(''month'', sales.placed_at)'}
      where: [sales.placed_at >= TIMESTAMP '2026-01-01']
    - metric: net_sales
      column: net_sales
      by: {month: 'date_trunc(''month'', sales.placed_at)'}
      where: [sales.placed_at >= TIMESTAMP '2026-01-01']
    sql: |
      SELECT date_trunc('month', s.placed_at) AS month,
             SUM(s.gross_amount) AS gross_sales,
             SUM(s.coupon_discount) AS coupon_discounts,
             SUM(CASE WHEN s.cancelled_at IS NOT NULL THEN s.net_amount ELSE 0 END) AS cancelled_net_sales,
             SUM(CASE WHEN s.cancelled_at IS NULL THEN s.net_amount ELSE 0 END) AS net_sales
      FROM sales s
      WHERE s.line_type = 'Sale' AND s.placed_at >= TIMESTAMP '2026-01-01'
      GROUP BY 1
      ORDER BY 1

  - id: lib-sales-19
    question: Which ten sellers sell the most, and what margin do we make on their products?
    variants: [top sellers by net sales and margin, biggest marketplace sellers]
    difficulty: hard
    tags: [sellers, ranking, profitability]
    metrics: [net_sales, gross_margin_pct]
    verify:
    - metric: net_sales
      column: net_sales
      by: {seller_name: sellers.seller_name, seller_type: sellers.seller_type}
      partial: true
    - metric: gross_margin_pct
      column: gross_margin_pct
      by: {seller_name: sellers.seller_name, seller_type: sellers.seller_type}
      partial: true
    sql: |
      SELECT se.seller_name, se.seller_type,
             SUM(CASE WHEN s.cancelled_at IS NULL THEN s.net_amount ELSE 0 END) AS net_sales,
             SUM(CASE WHEN s.delivered_at IS NOT NULL AND s.refunded_at IS NULL
                      THEN s.net_amount - s.tax_amount - s.shipping_fee - s.unit_cost * s.quantity END)
               / SUM(CASE WHEN s.delivered_at IS NOT NULL AND s.refunded_at IS NULL
                          THEN s.net_amount - s.tax_amount - s.shipping_fee END) AS gross_margin_pct
      FROM sales s JOIN sellers se ON se.seller_id = s.seller_id
      WHERE s.line_type = 'Sale'
      GROUP BY 1, 2
      ORDER BY net_sales DESC
      LIMIT 10

  - id: lib-sales-20
    question: Which traffic sources bring the most orders, and how big are those orders?
    variants: [orders and order value by traffic source, where do our buyers come from]
    difficulty: medium
    tags: [traffic, orders]
    metrics: [orders, aov]
    verify:
    - metric: orders
      column: orders
      by: {traffic_source: sales.traffic_source}
    - metric: aov
      column: aov
      by: {traffic_source: sales.traffic_source}
    sql: |
      SELECT s.traffic_source,
             COUNT(DISTINCT s.order_id) AS orders,
             SUM(CASE WHEN s.cancelled_at IS NULL THEN s.net_amount ELSE 0 END)
               / NULLIF(COUNT(DISTINCT CASE WHEN s.cancelled_at IS NULL THEN s.order_id END), 0) AS aov
      FROM sales s
      WHERE s.line_type = 'Sale'
      GROUP BY 1
      ORDER BY orders DESC

  - id: lib-sales-21
    question: Rank the sub-categories by how deeply they are discounted.
    variants: [discount ranking by sub-category, most discounted sub-categories]
    difficulty: medium
    tags: [pricing, ranking]
    metrics: [avg_discount_pct]
    verify:
    - metric: avg_discount_pct
      column: avg_discount_pct
      by: {sub_category: product_master.sub_category}
      partial: true
    sql: |
      WITH disc AS (
        SELECT p.sub_category,
               SUM((s.mrp - s.unit_price) * s.quantity) / SUM(s.mrp * s.quantity) AS avg_discount_pct,
               SUM(s.quantity) AS units
        FROM sales s JOIN product_master p ON p.product_id = s.product_id
        WHERE s.line_type = 'Sale'
        GROUP BY 1)
      SELECT sub_category, avg_discount_pct, units,
             RANK() OVER (ORDER BY avg_discount_pct DESC) AS discount_rank
      FROM disc
      ORDER BY discount_rank
      LIMIT 20

  - id: lib-sales-22
    question: Put October 2026's key numbers next to September's.
    variants: [this month versus last month KPIs, October against September summary]
    difficulty: hard
    tags: [kpi, period_comparison]
    metrics: [gross_sales, net_sales, orders, sessions]
    sql: |
      SELECT 'gross sales' AS measure,
             SUM(s.gross_amount) FILTER (WHERE s.placed_at < TIMESTAMP '2026-10-01') AS september_2026,
             SUM(s.gross_amount) FILTER (WHERE s.placed_at >= TIMESTAMP '2026-10-01') AS october_2026
      FROM sales s
      WHERE s.line_type = 'Sale' AND s.placed_at >= TIMESTAMP '2026-09-01' AND s.placed_at < TIMESTAMP '2026-11-01'
      UNION ALL
      SELECT 'net sales',
             SUM(CASE WHEN s.cancelled_at IS NULL THEN s.net_amount ELSE 0 END) FILTER (WHERE s.placed_at < TIMESTAMP '2026-10-01'),
             SUM(CASE WHEN s.cancelled_at IS NULL THEN s.net_amount ELSE 0 END) FILTER (WHERE s.placed_at >= TIMESTAMP '2026-10-01')
      FROM sales s
      WHERE s.line_type = 'Sale' AND s.placed_at >= TIMESTAMP '2026-09-01' AND s.placed_at < TIMESTAMP '2026-11-01'
      UNION ALL
      SELECT 'orders',
             COUNT(DISTINCT s.order_id) FILTER (WHERE s.placed_at < TIMESTAMP '2026-10-01'),
             COUNT(DISTINCT s.order_id) FILTER (WHERE s.placed_at >= TIMESTAMP '2026-10-01')
      FROM sales s
      WHERE s.line_type = 'Sale' AND s.placed_at >= TIMESTAMP '2026-09-01' AND s.placed_at < TIMESTAMP '2026-11-01'
      UNION ALL
      SELECT 'sessions',
             COUNT(DISTINCT c.session_id) FILTER (WHERE c.event_at < TIMESTAMP '2026-10-01'),
             COUNT(DISTINCT c.session_id) FILTER (WHERE c.event_at >= TIMESTAMP '2026-10-01')
      FROM clickstream c
      WHERE c.event_at >= TIMESTAMP '2026-09-01' AND c.event_at < TIMESTAMP '2026-11-01'
    notes: One row per measure (UNION ALL); each part filters the same two months.

  - id: lib-sales-23
    question: How much net sales does each channel group get credit for under last-click attribution?
    variants: [net sales credited to channels, last-click credited sales by channel group]
    difficulty: hard
    tags: [attribution]
    metrics: []
    sql: |
      SELECT a.channel_group,
             SUM(CASE WHEN s.cancelled_at IS NULL THEN s.net_amount ELSE 0 END * a.credit_last_click)
               AS credited_net_sales,
             SUM(a.credit_last_click) AS credited_order_lines
      FROM sales s JOIN marketing_attribution a ON a.order_id = s.order_id
      WHERE s.line_type = 'Sale'
      GROUP BY 1
      ORDER BY credited_net_sales DESC
    notes: Joining order lines to touchpoints repeats each line once per touch, but each order's credits add up to 1,
      so weighting by the credit counts every line exactly once.

  - id: lib-sales-24
    question: Which pairs of sub-categories are most often bought in the same order?
    variants: [products bought together, cross-sell pairs, basket combinations]
    difficulty: hard
    tags: [basket, cross-sell]
    metrics: []
    sql: |
      WITH lines AS (
        SELECT DISTINCT s.order_id, p.sub_category
        FROM sales s JOIN product_master p ON p.product_id = s.product_id
        WHERE s.line_type = 'Sale')
      SELECT a.sub_category AS first_sub_category, b.sub_category AS second_sub_category,
             COUNT(*) AS orders_with_both
      FROM lines a JOIN lines b ON a.order_id = b.order_id AND a.sub_category < b.sub_category
      GROUP BY 1, 2
      ORDER BY orders_with_both DESC
      LIMIT 10

  - id: lib-sales-25
    question: What share of net sales comes from the top 10% of customers?
    variants: [revenue concentration among customers, how dependent are we on our best customers]
    difficulty: hard
    tags: [pareto, concentration]
    metrics: []
    sql: |
      WITH per_customer AS (
        SELECT s.customer_id, SUM(CASE WHEN s.cancelled_at IS NULL THEN s.net_amount ELSE 0 END) AS net_sales
        FROM sales s
        WHERE s.line_type = 'Sale'
        GROUP BY 1),
      deciles AS (
        SELECT net_sales, NTILE(10) OVER (ORDER BY net_sales DESC) AS decile
        FROM per_customer)
      SELECT decile, COUNT(*) AS customers, SUM(net_sales) AS net_sales,
             SUM(net_sales) / SUM(SUM(net_sales)) OVER () AS share_of_net_sales
      FROM deciles
      GROUP BY 1
      ORDER BY 1

  - id: lib-sales-26
    question: How much net sales did we make per day during each 2026 sale event?
    variants: [daily sales rate in each sale event this year, sale event sales per day]
    difficulty: hard
    tags: [events, per_day_rate]
    metrics: [net_sales]
    sql: |
      SELECT e.name AS sale_event, e.start_date, e.end_date,
             date_diff('day', e.start_date, e.end_date) + 1 AS event_days,
             SUM(CASE WHEN s.cancelled_at IS NULL THEN s.net_amount ELSE 0 END) AS net_sales,
             SUM(CASE WHEN s.cancelled_at IS NULL THEN s.net_amount ELSE 0 END)
               / (date_diff('day', e.start_date, e.end_date) + 1) AS net_sales_per_day
      FROM sale_events e
      JOIN sales s ON s.placed_at >= e.start_date AND s.placed_at < e.end_date + INTERVAL 1 DAY
      WHERE s.line_type = 'Sale' AND e.start_date >= TIMESTAMP '2026-01-01' AND e.end_date <= TIMESTAMP '2026-11-14'
      GROUP BY 1, 2, 3, 4
      ORDER BY net_sales_per_day DESC
    notes: Sales are matched to an event by its date window; overlapping events each count the shared days.

  - id: lib-sales-27
    question: How did each month of 2026 compare with the same month of 2025 in net sales?
    variants: [year over year growth by month, same month last year comparison]
    difficulty: hard
    tags: [growth, period_comparison]
    metrics: [net_sales]
    verify:
    - metric: net_sales
      column: net_sales
      by: {month: 'date_trunc(''month'', sales.placed_at)'}
      partial: true
    sql: |
      WITH monthly AS (
        SELECT date_trunc('month', s.placed_at) AS month,
               SUM(CASE WHEN s.cancelled_at IS NULL THEN s.net_amount ELSE 0 END) AS net_sales
        FROM sales s
        WHERE s.line_type = 'Sale'
        GROUP BY 1)
      SELECT month, net_sales,
             LAG(net_sales, 12) OVER (ORDER BY month) AS net_sales_year_before,
             net_sales / NULLIF(LAG(net_sales, 12) OVER (ORDER BY month), 0) - 1 AS yoy_growth
      FROM monthly
      QUALIFY month >= TIMESTAMP '2026-01-01'
      ORDER BY month
    notes: November 2026 is incomplete (data ends on the 14th), so its comparison is not like for like.
