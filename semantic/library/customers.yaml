# Query library: customers (sign-ups, cohorts, retention, segments, logins). Reference queries for retrieval.
area: customers
queries:
  - id: lib-cust-01
    question: For each monthly sign-up cohort of 2026, what share of customers placed an order within 30 days?
    variants: [sign-up to first order conversion by cohort, how quickly do new sign-ups buy]
    difficulty: hard
    tags: [cohort, activation]
    metrics: []
    sql: |
      WITH first_orders AS (
        SELECT s.customer_id, MIN(s.placed_at) AS first_order_at
        FROM sales s
        WHERE s.line_type = 'Sale'
        GROUP BY 1)
      SELECT date_trunc('month', c.signup_at) AS signup_month,
             COUNT(*) AS signups,
             COUNT(*) FILTER (WHERE f.first_order_at <= c.signup_at + INTERVAL 30 DAY) AS ordered_within_30_days,
             COUNT(*) FILTER (WHERE f.first_order_at <= c.signup_at + INTERVAL 30 DAY) * 1.0 / COUNT(*)
               AS activation_rate_30d
      FROM customers c
      LEFT JOIN first_orders f ON f.customer_id = c.customer_id
      WHERE c.signup_at >= TIMESTAMP '2026-01-01' AND c.signup_at < TIMESTAMP '2026-10-15'
      GROUP BY 1
      ORDER BY 1
    notes: Cohorts after mid-October have not had 30 days yet, so they are left out.

  - id: lib-cust-02
    question: Which acquisition channels bring customers who come back and order again?
    variants: [repeat purchase rate by sign-up channel, are paid-social customers loyal]
    difficulty: hard
    tags: [retention, acquisition]
    metrics: [repeat_purchase_rate]
    sql: |
      WITH per_customer AS (
        SELECT s.customer_id, COUNT(DISTINCT s.order_id) AS orders
        FROM sales s
        WHERE s.line_type = 'Sale'
        GROUP BY 1)
      SELECT c.signup_channel,
             COUNT(*) AS buyers,
             AVG(CASE WHEN pc.orders >= 2 THEN 1.0 ELSE 0 END) AS repeat_purchase_rate,
             AVG(pc.orders) AS orders_per_buyer
      FROM per_customer pc JOIN customers c ON c.customer_id = pc.customer_id
      GROUP BY 1
      ORDER BY repeat_purchase_rate DESC

  - id: lib-cust-03
    question: Of the customers who bought in 2025, how many bought again in 2026?
    variants: [2025 buyers retained into 2026, year-over-year customer retention]
    difficulty: hard
    tags: [retention]
    metrics: []
    sql: |
      WITH buyers_2025 AS (
        SELECT DISTINCT s.customer_id
        FROM sales s
        WHERE s.line_type = 'Sale' AND s.placed_at >= TIMESTAMP '2025-01-01' AND s.placed_at < TIMESTAMP '2026-01-01')
      SELECT COUNT(*) AS buyers_2025,
             COUNT(*) FILTER (WHERE EXISTS (
               SELECT 1 FROM sales s2
               WHERE s2.customer_id = b.customer_id AND s2.line_type = 'Sale'
                 AND s2.placed_at >= TIMESTAMP '2026-01-01')) AS bought_again_2026,
             COUNT(*) FILTER (WHERE EXISTS (
               SELECT 1 FROM sales s2
               WHERE s2.customer_id = b.customer_id AND s2.line_type = 'Sale'
                 AND s2.placed_at >= TIMESTAMP '2026-01-01')) * 1.0 / COUNT(*) AS retention_rate
      FROM buyers_2025 b

  - id: lib-cust-04
    question: How many orders does a buyer place, and how much do they spend per order, in each age bracket?
    variants: [orders per customer by age group, spending by customer age]
    difficulty: medium
    tags: [segments, age]
    metrics: [aov, orders]
    verify:
    - metric: aov
      column: aov
      by: {age_bracket: customers.age_bracket}
    - metric: orders
      column: orders
      by: {age_bracket: customers.age_bracket}
    sql: |
      SELECT c.age_bracket,
             COUNT(DISTINCT s.customer_id) AS buyers,
             COUNT(DISTINCT s.order_id) AS orders,
             COUNT(DISTINCT s.order_id) * 1.0 / COUNT(DISTINCT s.customer_id) AS orders_per_buyer,
             SUM(CASE WHEN s.cancelled_at IS NULL THEN s.net_amount ELSE 0 END)
               / NULLIF(COUNT(DISTINCT CASE WHEN s.cancelled_at IS NULL THEN s.order_id END), 0) AS aov
      FROM sales s JOIN customers c ON c.customer_id = s.customer_id
      WHERE s.line_type = 'Sale'
      GROUP BY 1
      ORDER BY 1

  - id: lib-cust-05
    question: In which delivery states do new customers make up the largest share of orders?
    variants: [new versus returning order mix by state, first-time buyer share per state]
    difficulty: medium
    tags: [new customers, geography]
    metrics: [new_customer_order_share, orders]
    verify:
    - metric: new_customer_order_share
      column: new_customer_order_share
      by: {state: customer_addresses.state}
      partial: true
    - metric: orders
      column: orders
      by: {state: customer_addresses.state}
      partial: true
    sql: |
      SELECT a.state,
             COUNT(DISTINCT s.order_id) AS orders,
             COUNT(DISTINCT CASE WHEN s.is_first_order THEN s.order_id END) * 1.0
               / COUNT(DISTINCT s.order_id) AS new_customer_order_share
      FROM sales s JOIN customer_addresses a ON a.address_id = s.address_id
      WHERE s.line_type = 'Sale'
      GROUP BY 1
      HAVING COUNT(DISTINCT s.order_id) >= 500
      ORDER BY new_customer_order_share DESC
      LIMIT 15

  - id: lib-cust-06
    question: Which devices do people sign up on, month by month in 2026?
    variants: [sign-ups by device each month, app versus web registrations over time]
    difficulty: medium
    tags: [signups, device, trend]
    metrics: []
    sql: |
      SELECT date_trunc('month', c.signup_at) AS month, c.signup_device,
             COUNT(*) AS signups
      FROM customers c
      WHERE c.signup_at >= TIMESTAMP '2026-01-01'
      GROUP BY 1, 2
      ORDER BY 1, signups DESC

  - id: lib-cust-07
    question: How many days does it typically take from sign-up to first order, by sign-up channel?
    variants: [median time to first purchase, days between registering and buying]
    difficulty: hard
    tags: [activation, median]
    metrics: []
    sql: |
      WITH first_orders AS (
        SELECT s.customer_id, MIN(s.placed_at) AS first_order_at
        FROM sales s
        WHERE s.line_type = 'Sale'
        GROUP BY 1)
      SELECT c.signup_channel,
             COUNT(*) AS buyers,
             AVG(CASE WHEN date_diff('day', c.signup_at, f.first_order_at) = 0 THEN 1.0 ELSE 0 END)
               AS same_day_share,
             MEDIAN(date_diff('day', c.signup_at, f.first_order_at))
               FILTER (WHERE date_diff('day', c.signup_at, f.first_order_at) > 0) AS median_days_if_not_same_day
      FROM customers c JOIN first_orders f ON f.customer_id = c.customer_id
      GROUP BY 1
      ORDER BY same_day_share DESC
    notes: Most buyers sign up at checkout (first order on day 0), so the plain median is 0 for every channel;
      the same-day share and the median of the others say more.

  - id: lib-cust-08
    question: How are buyers spread across lifetime spend bands?
    variants: [customer value tiers, how many customers spent over 10,000 in total]
    difficulty: medium
    tags: [segments, value]
    metrics: []
    sql: |
      WITH per_customer AS (
        SELECT s.customer_id,
               SUM(CASE WHEN s.cancelled_at IS NULL THEN s.net_amount ELSE 0 END) AS lifetime_net_sales
        FROM sales s
        WHERE s.line_type = 'Sale'
        GROUP BY 1)
      SELECT CASE WHEN lifetime_net_sales < 1000 THEN '1. under 1,000'
                  WHEN lifetime_net_sales < 3000 THEN '2. 1,000-2,999'
                  WHEN lifetime_net_sales < 10000 THEN '3. 3,000-9,999'
                  ELSE '4. 10,000 and above' END AS spend_band,
             COUNT(*) AS buyers,
             SUM(lifetime_net_sales) AS net_sales,
             SUM(lifetime_net_sales) / SUM(SUM(lifetime_net_sales)) OVER () AS share_of_net_sales
      FROM per_customer
      GROUP BY 1
      ORDER BY 1

  - id: lib-cust-09
    question: Who are our ten biggest customers by realized revenue, and how many orders has each placed?
    variants: [top 10 customers by revenue, highest value customers]
    difficulty: medium
    tags: [ranking, customers]
    metrics: [realized_revenue, orders]
    verify:
    - metric: realized_revenue
      column: realized_revenue
      by: {customer_id: sales.customer_id}
      partial: true
    - metric: orders
      column: orders
      by: {customer_id: sales.customer_id}
      partial: true
    sql: |
      SELECT s.customer_id,
             COUNT(DISTINCT s.order_id) AS orders,
             SUM(CASE WHEN s.delivered_at IS NOT NULL THEN s.net_amount - COALESCE(s.refund_amount, 0) ELSE 0 END)
               AS realized_revenue
      FROM sales s
      WHERE s.line_type = 'Sale'
      GROUP BY 1
      ORDER BY realized_revenue DESC
      LIMIT 10
    notes: Customer IDs only; names and contact details are not available.

  - id: lib-cust-10
    question: What share of customers in each region have opted in to email, SMS, push and WhatsApp?
    variants: [marketing opt-in rates by region, how reachable are customers by channel]
    difficulty: medium
    tags: [crm, consent]
    metrics: []
    sql: |
      SELECT c.region,
             COUNT(*) AS customers,
             AVG(CASE WHEN c.email_opt_in THEN 1.0 ELSE 0 END) AS email_opt_in_rate,
             AVG(CASE WHEN c.sms_opt_in THEN 1.0 ELSE 0 END) AS sms_opt_in_rate,
             AVG(CASE WHEN c.push_opt_in THEN 1.0 ELSE 0 END) AS push_opt_in_rate,
             AVG(CASE WHEN c.whatsapp_opt_in THEN 1.0 ELSE 0 END) AS whatsapp_opt_in_rate
      FROM customers c
      GROUP BY 1
      ORDER BY customers DESC

  - id: lib-cust-11
    question: How often do OTP logins fail, by device and login method?
    variants: [OTP failure rate, login problems by device]
    difficulty: medium
    tags: [logins, device]
    metrics: []
    sql: |
      SELECT a.device, a.method,
             COUNT(*) FILTER (WHERE a.event_type IN ('login', 'otp_failed')) AS login_attempts,
             COUNT(*) FILTER (WHERE a.event_type = 'otp_failed') AS otp_failures,
             COUNT(*) FILTER (WHERE a.event_type = 'otp_failed') * 1.0
               / NULLIF(COUNT(*) FILTER (WHERE a.event_type IN ('login', 'otp_failed')), 0) AS otp_failure_rate
      FROM auth_events a
      GROUP BY 1, 2
      ORDER BY otp_failure_rate DESC

  - id: lib-cust-12
    question: Do customers in different city tiers log in on different devices?
    variants: [login device mix by city tier, app usage by tier]
    difficulty: medium
    tags: [logins, geography]
    metrics: []
    sql: |
      SELECT c.city_tier, a.device,
             COUNT(*) AS logins,
             COUNT(*) * 1.0 / SUM(COUNT(*)) OVER (PARTITION BY c.city_tier) AS share_of_tier_logins
      FROM auth_events a JOIN customers c ON c.customer_id = a.customer_id
      WHERE a.event_type = 'login'
      GROUP BY 1, 2
      ORDER BY 1, logins DESC

  - id: lib-cust-13
    question: How many customers are Prime members in each state, and what share of customers is that?
    variants: [Prime penetration by state, where are Prime members]
    difficulty: medium
    tags: [prime, geography]
    metrics: []
    sql: |
      SELECT c.state,
             COUNT(*) AS customers,
             COUNT(*) FILTER (WHERE c.is_prime) AS prime_members,
             AVG(CASE WHEN c.is_prime THEN 1.0 ELSE 0 END) AS prime_share
      FROM customers c
      GROUP BY 1
      HAVING COUNT(*) >= 200
      ORDER BY prime_share DESC

  - id: lib-cust-14
    question: How long after signing up do customers join Prime, and how many joined each month of 2026?
    variants: [Prime join trend, time from sign-up to Prime]
    difficulty: hard
    tags: [prime, trend, median]
    metrics: []
    sql: |
      SELECT date_trunc('month', c.prime_start_date) AS month,
             COUNT(*) AS new_prime_members,
             MEDIAN(date_diff('day', c.signup_at, c.prime_start_date)) AS median_days_after_signup
      FROM customers c
      WHERE c.is_prime AND c.prime_start_date >= TIMESTAMP '2026-01-01'
      GROUP BY 1
      ORDER BY 1

  - id: lib-cust-15
    question: Which customers placed the most orders in 2026, and how many different categories did they buy?
    variants: [most frequent buyers this year, top repeat customers and their category breadth]
    difficulty: hard
    tags: [ranking, customers, breadth]
    metrics: [orders]
    sql: |
      SELECT s.customer_id,
             COUNT(DISTINCT s.order_id) AS orders,
             COUNT(DISTINCT p.category) AS categories_bought
      FROM sales s JOIN product_master p ON p.product_id = s.product_id
      WHERE s.line_type = 'Sale' AND s.placed_at >= TIMESTAMP '2026-01-01'
      GROUP BY 1
      ORDER BY orders DESC, categories_bought DESC
      LIMIT 20

  - id: lib-cust-16
    question: Which ten cities have the most sign-ups, and how many of those customers have bought something?
    variants: [sign-ups by customer city, cities with the most registered customers]
    difficulty: medium
    tags: [signups, geography]
    metrics: []
    sql: |
      WITH buyers AS (SELECT DISTINCT s.customer_id FROM sales s WHERE s.line_type = 'Sale')
      SELECT c.city,
             COUNT(*) AS signups,
             COUNT(b.customer_id) AS buyers,
             COUNT(b.customer_id) * 1.0 / COUNT(*) AS share_who_bought
      FROM customers c LEFT JOIN buyers b ON b.customer_id = c.customer_id
      GROUP BY 1
      ORDER BY signups DESC
      LIMIT 10
    notes: customers.city is where the customer signed up; for where orders were delivered use sales.ship_city.

  - id: lib-cust-17
    question: For first-time buyers in each quarter, what share ordered again within 90 days?
    variants: [90-day repeat rate by first-purchase cohort, quarterly cohort retention]
    difficulty: hard
    tags: [cohort, retention]
    metrics: []
    sql: |
      WITH firsts AS (
        SELECT s.customer_id, MIN(s.placed_at) AS first_at
        FROM sales s
        WHERE s.line_type = 'Sale'
        GROUP BY 1)
      SELECT date_trunc('quarter', f.first_at) AS first_order_quarter,
             COUNT(*) AS new_buyers,
             AVG(CASE WHEN EXISTS (
                   SELECT 1 FROM sales s
                   WHERE s.customer_id = f.customer_id AND s.line_type = 'Sale'
                     AND s.placed_at > f.first_at AND s.placed_at <= f.first_at + INTERVAL 90 DAY)
                 THEN 1.0 ELSE 0 END) AS repeat_within_90d
      FROM firsts f
      WHERE f.first_at <= TIMESTAMP '2026-08-16'
      GROUP BY 1
      ORDER BY 1
    notes: Only buyers whose first order is at least 90 days before the data's last day (2026-11-14) are judged.

  - id: lib-cust-18
    question: How many customers have their delivery address in a different city from where they signed up?
    variants: [customers delivering outside their sign-up city, sign-up city versus delivery city]
    difficulty: medium
    tags: [geography, customers]
    metrics: []
    sql: |
      SELECT c.region,
             COUNT(*) AS customers,
             AVG(CASE WHEN lower(a.city) <> lower(c.city) THEN 1.0 ELSE 0 END) AS share_delivering_elsewhere
      FROM customers c JOIN customer_addresses a ON a.customer_id = c.customer_id
      GROUP BY 1
      ORDER BY 1

  - id: lib-cust-19
    question: Do customers from smaller cities come back to buy again as often as metro customers?
    variants: [repeat purchase rate by city tier, loyalty by customer city tier]
    difficulty: hard
    tags: [retention, geography]
    metrics: [repeat_purchase_rate]
    sql: |
      WITH per_customer AS (
        SELECT s.customer_id, COUNT(DISTINCT s.order_id) AS orders
        FROM sales s
        WHERE s.line_type = 'Sale'
        GROUP BY 1)
      SELECT c.city_tier,
             COUNT(*) AS buyers,
             AVG(CASE WHEN pc.orders >= 2 THEN 1.0 ELSE 0 END) AS repeat_purchase_rate
      FROM per_customer pc JOIN customers c ON c.customer_id = pc.customer_id
      GROUP BY 1
      ORDER BY 1

  - id: lib-cust-20
    question: On which devices do first-time buyers place their orders, compared with returning buyers?
    variants: [new customer share of orders by device, first orders by device]
    difficulty: medium
    tags: [new customers, device]
    metrics: [new_customer_order_share, orders]
    verify:
    - metric: new_customer_order_share
      column: new_customer_order_share
      by: {device: sales.device}
    - metric: orders
      column: orders
      by: {device: sales.device}
    sql: |
      SELECT s.device,
             COUNT(DISTINCT s.order_id) AS orders,
             COUNT(DISTINCT CASE WHEN s.is_first_order THEN s.order_id END) * 1.0
               / COUNT(DISTINCT s.order_id) AS new_customer_order_share
      FROM sales s
      WHERE s.line_type = 'Sale'
      GROUP BY 1
      ORDER BY orders DESC
