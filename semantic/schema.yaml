# Pantree data dictionary: 22 tables the agent may query (from ecommerce-simulator).
# Column format: '<type> - <note>'. Blocked tables/columns are hidden from the agent and the database.
tables:
  product_master:
    group: Catalogue
    grain: one row per product style
    description: 'Products launched so far. Hierarchy: category -> sub_category -> article_type -> product -> SKU.'
    time_column: launch_date
    columns:
      product_id: text - primary key
      source_product_id: integer
      product_name: text
      brand_name: text
      gender: text
      category: text
      sub_category: text
      article_type: text
      colour: text
      season: text
      usage: text
      material: text
      fit: text
      size_type: text - Apparel, Footwear or Free Size
      mrp: number - list price (Rs, GST included)
      unit_cost: number - what the shop pays the supplier
      gst_rate: number - tax rate for this product
      seller_id: text - links to sellers
      launch_date: timestamp - first day on sale
      discontinue_date: timestamp - last day on sale (empty if still sold)
      image_url: text
      description: text
      is_active: boolean
  product_skus:
    group: Catalogue
    grain: one row per size of a product
    description: Sellable units. Stock, purchase orders and sales are kept per SKU.
    columns:
      sku_id: text - primary key
      product_id: text - links to product_master
      size: text - XS-XXL, 6-11 or Free Size
      barcode: text - EAN-13
  sellers:
    group: Catalogue
    grain: one row per seller
    description: Brands and marketplace sellers. 1P = own stock, 3P-FBA = seller's stock in our warehouse, 3P-MFN = seller
      ships.
    time_column: onboarding_date
    columns:
      seller_id: text - primary key
      seller_name: text
      seller_type: text
      city: text
      state: text
      region: text
      home_warehouse_id: text - links to warehouses
      onboarding_date: timestamp
      rating: number
      fulfillment_score: number
      cancellation_rate: number
      lead_time_days: integer - days from purchase order to delivery
      commission_rate: number - marketplace fee
      is_active: boolean
  warehouses:
    group: Catalogue
    grain: one row per warehouse
    description: Fulfilment centres.
    columns:
      warehouse_id: text - primary key
      city: text
      region: text
      capacity_units: integer
  agents:
    group: Service
    grain: one row per support agent
    description: Customer support staff.
    time_column: hire_date
    columns:
      agent_id: text - primary key
      agent_name: text
      team: text - Orders, Returns, Payments or Product Support
      location: text
      language: text
      hire_date: timestamp
  sale_events:
    group: Events & offers
    grain: one row per sale event
    description: Festivals and sales, live only between start_date and end_date (Prime members from prime_early_access_date).
    time_column: start_date
    columns:
      event_id: text - primary key
      name: text
      event_type: text
      start_date: timestamp
      end_date: timestamp
      prime_early_access_date: timestamp
      categories_on_offer: text - All, Ethnic, Gifting, Women, Winter, Summer or Casual
      avg_extra_discount: number - average extra discount on covered products
      demand_uplift: number - how much busier the shop is during the event
      run_up_days: integer - days before the start when campaigns and browsing ramp up
  promotions:
    group: Events & offers
    grain: one row per coupon
    description: 'Coupon codes: one or two per event plus always-on offers (FIRST100, BANK10, PRIME15).'
    time_column: start_date
    columns:
      promo_id: text - primary key
      code: text - used in sales.coupon_code
      event_id: text - links to sale_events
      offer_type: text - % Off, Flat Off or Bank Offer
      value: number
      min_order_value: integer
      max_discount: integer
      eligible_audience: text
      eligible_payment_method: text
      usage_limit_per_customer: integer - times one customer may use it
      start_date: timestamp
      end_date: timestamp
  campaigns:
    group: Marketing
    grain: one row per campaign
    description: 'Paid search, paid social, display, affiliate and CRM campaigns: monthly always-on ones and event ones.'
    time_column: start_date
    columns:
      campaign_id: text - primary key
      event_id: text - links to sale_events
      promo_code: text - links to promotions.code
      affiliate_partner: text - affiliate site (affiliate campaigns only)
      affiliate_type: text
      payout_model: text - CPS (% of sale), CPA (per new customer) or CPC (per click)
      payout_rate: number
      utm_source: text
      utm_medium: text
      campaign_name: text
      channel_group: text - Paid Search, Paid Social, Display, Affiliate or CRM
      channel: text
      campaign_type: text - Brand, Generic, Performance, Prospecting, Retargeting, Event or Lifecycle
      objective: text
      audience: text
      offer_type: text
      start_date: timestamp
      end_date: timestamp
      total_budget: number
      utm_campaign: text - matches clickstream.utm_campaign
      status: text
  marketing_plan:
    group: Marketing
    grain: one row per paid campaign per day
    description: Planned budget and targets, set when the campaign is created (may run past today).
    time_column: date
    columns:
      date: timestamp
      campaign_id: text - links to campaigns
      planned_spend: number - Rs
      target_impressions: integer
      target_clicks: integer
      target_orders: number
      target_revenue: number
  marketing_spend:
    group: Marketing
    grain: one row per campaign per hour (per region for paid media)
    description: Actual delivery. platform_conversions are what the ad platform reports (more than the shop sees). Affiliate
      spend = commissions and per-click fees; CRM spend = message costs.
    time_column: date_hour
    columns:
      date_hour: timestamp - start of the hour
      campaign_id: text - links to campaigns
      region: text
      spend: number - Rs spent in that hour
      impressions: integer
      clicks: integer
      platform_conversions: integer
      platform_revenue: number - revenue the ad platform claims (over-reported)
  marketing_attribution:
    group: Marketing
    grain: one row per order per marketing touchpoint
    description: Campaign visits in the 30 days before an order, with credit under four models (each sums to 1 per order).
      Orders with no campaign visit get one 'Direct/Organic' row.
    time_column: order_at
    columns:
      order_id: text - links to sales
      customer_id: text
      order_at: timestamp
      touch_number: integer
      touch_at: timestamp
      campaign_id: text - links to campaigns
      channel_group: text
      credit_last_click: number - share of the order credited to this touch (last-click model)
      credit_first_click: number
      credit_linear: number
      credit_time_decay: number - half-life 7 days
      order_revenue: number - the order's revenue; multiply by a credit column to attribute it
  inventory_history:
    group: Inventory & price
    grain: one row per SKU per day on which its stock moved
    description: Daily stock movements; closing = opening + received + returned_restocked - sold. Days without a row had no
      movement.
    time_column: date
    columns:
      date: timestamp
      sku_id: text - links to product_skus
      product_id: text
      warehouse_id: text
      opening_stock: integer
      received: integer
      sold: integer
      returned_restocked: integer
      damaged: integer
      closing_stock: integer - stock at end of that day for that SKU
      demand_units: integer - add-to-cart attempts, including when out of stock
      lost_sales_units: integer - demand that could not be served
      stock_status: text - Healthy, Low or Out of Stock
  inventory_live:
    group: Inventory & price
    grain: one row per SKU
    description: Stock at the end of today.
    time_column: updated_at
    columns:
      sku_id: text - links to product_skus
      product_id: text
      warehouse_id: text
      on_hand_qty: integer - units in stock now
      inbound_qty: integer - on open purchase orders
      reorder_point: integer - stock level that triggers a reorder
      updated_at: timestamp
  price_history:
    group: Inventory & price
    grain: one row per product per period with the same price
    description: Selling price over time (valid_from .. valid_to; valid_to empty = current price).
    time_column: valid_from
    columns:
      product_id: text - links to product_master
      valid_from: timestamp
      valid_to: timestamp
      mrp: number
      selling_price: number
      discount_pct: number
      price_change_reason: text - List Price, Everyday Markdown, Cost Change, Sale Event or Clearance
      event_id: text - links to sale_events
  customers:
    group: Customers
    grain: one row per customer
    description: 'Accounts (no personal data). account_status: Active, Dormant (not seen for 180 days) or Deleted.'
    time_column: signup_at
    columns:
      customer_id: text - primary key
      signup_at: timestamp
      signup_channel: text - traffic source of the sign-up visit
      signup_campaign_id: text - links to campaigns
      signup_method: text
      signup_device: text
      anonymous_id: text - visitor id before sign-up (-> clickstream)
      city: text
      state: text
      region: text
      city_tier: text
      age_bracket: text
      gender: text
      is_prime: boolean - Prime (paid loyalty) member now
      prime_start_date: timestamp
      email_opt_in: boolean
      sms_opt_in: boolean
      push_opt_in: boolean
      whatsapp_opt_in: boolean
      account_status: text
  customer_addresses:
    group: Customers
    grain: one row per address
    description: Delivery addresses.
    time_column: created_at
    columns:
      address_id: text - primary key
      customer_id: text - links to customers
      label: text
      city: text
      state: text
      region: text
      city_tier: text
      pincode: text
      is_default: boolean
      nearest_warehouse_id: text - links to warehouses
      created_at: timestamp
  auth_events:
    group: Customers
    grain: one row per sign-up / login attempt
    description: signup, login and otp_failed events.
    time_column: event_at
    columns:
      event_at: timestamp
      customer_id: text - links to customers
      event_type: text
      method: text
      device: text
      success: boolean
      session_id: text - links to clickstream
  clickstream:
    group: Customers
    grain: one row per event in a visit
    description: Every page view and action. Anonymous visitors have anonymous_id only; customer_id appears after sign-up.
    time_column: event_at
    columns:
      event_id: text - primary key
      session_id: text - one visit; a purchase event marks a converting visit
      anonymous_id: text
      customer_id: text - links to customers
      event_at: timestamp
      event_type: text - session_start, home_view, plp_view, search, pdp_view, add_to_cart, checkout_start, payment_attempt,
        payment_failed, purchase, session_end, ...
      page_type: text
      product_id: text - links to product_master
      sku_id: text - links to product_skus
      list_position: number - position of the product when it was clicked from a list
      search_query: text
      device: text
      traffic_source: text
      utm_source: text
      utm_medium: text
      utm_campaign: text
      campaign_id: text - links to campaigns
      order_id: text - links to sales (purchase events)
      dwell_seconds: number
  impressions:
    group: Customers
    grain: one row per product shown in a list
    description: Products shown on home recommendations, listings, search results and 'similar products'.
    time_column: shown_at
    columns:
      page_event_id: text - links to clickstream.event_id (the page that showed it)
      session_id: text
      anonymous_id: text
      customer_id: text
      shown_at: timestamp
      surface: text
      position: integer - 1 = top
      product_id: text - links to product_master
      clicked: boolean - the visitor opened it
      added_to_cart: boolean - then added it to the cart
  sales:
    group: Sales
    grain: one row per transaction line (item in an order)
    description: Orders, payments, shipping, returns and refunds in one table. Each milestone has its own timestamp; order_status
      is the latest milestone reached today and updated_at the time of the last change. Exchange replacements are extra lines
      (line_type = Exchange) in the same order.
    time_column: placed_at
    columns:
      transaction_id: text - primary key
      order_id: text - order
      shipment_id: text - parcel
      line_type: text - Sale = item bought; Exchange = free replacement line (amounts 0). Filter line_type = 'Sale' for sales
        metrics
      customer_id: text - links to customers
      session_id: text - links to clickstream
      address_id: text - links to customer_addresses
      ship_city: text
      ship_pincode: text
      product_id: text
      sku_id: text - links to product_skus
      seller_id: text
      warehouse_id: text
      quantity: integer
      mrp: number
      unit_price: number - selling price per unit (after markdowns, before coupon)
      gross_amount: number - unit_price * quantity (before coupon)
      coupon_code: text
      coupon_discount: number
      shipping_fee: number
      net_amount: number - gross_amount - coupon_discount + shipping_fee (GST included)
      tax_amount: number - GST included in net_amount
      gst_rate: number
      unit_cost: number
      payment_method: text
      event_id: text - sale event whose price applied (NULL = normal day)
      campaign_id: text - links to campaigns
      traffic_source: text
      device: text
      affiliate_partner: text
      affiliate_commission: number - payable to the affiliate for this line
      is_first_order: boolean - the customer's first ever order
      courier: text
      promised_delivery_date: timestamp
      placed_at: timestamp
      confirmed_at: timestamp
      shipped_at: timestamp
      out_for_delivery_at: timestamp
      delivered_at: timestamp - set once delivered; NULL if not (yet) delivered
      return_requested_at: timestamp
      return_picked_up_at: timestamp
      return_received_at: timestamp
      exchanged_at: timestamp
      refunded_at: timestamp
      cancelled_at: timestamp - set if the line was cancelled before shipping
      rto_at: 'timestamp - returned to origin: parcel came back undelivered (mostly COD refusals)'
      undelivered_at: timestamp
      lost_at: timestamp
      payment_collected_at: timestamp
      cancel_reason: text
      cancelled_by: text
      return_reason: text
      return_type: text
      return_qc_result: text
      refund_amount: number - money returned to the customer (refunds and store credit)
      replacement_transaction_id: text
      size_fit: text
      order_status: text - Placed, Confirmed, Shipped, Out for Delivery, Delivered, Return Requested, Return Picked Up, Returned,
        Exchanged, Refunded, Cancelled, Returned to Origin, Undelivered or Lost
      updated_at: timestamp
      payment_status: text - Paid, Pending (COD not yet collected), Not Collected, Refunded or Not Applicable
  product_reviews:
    group: Service
    grain: one row per review
    description: Reviews written after delivery.
    time_column: reviewed_at
    columns:
      review_id: text - primary key
      transaction_id: text - links to sales
      order_id: text
      customer_id: text
      product_id: text
      rating: integer - 1-5 stars
      title: text
      review_text: text
      aspect: 'text - what the review is about: Quality, Delivery, Look, Price, Size'
      sentiment: text
      verified_purchase: boolean
      moderation_status: text - Published or Rejected
      helpful_votes: integer
      reviewed_at: timestamp
  support_contacts:
    group: Service
    grain: one row per contact (a ticket can have several)
    description: Customer contacts triggered by late deliveries, failed deliveries, refunds, exchanges and payment problems.
    time_column: contact_at
    columns:
      contact_id: text - primary key
      ticket_id: text - groups contacts
      customer_id: text
      order_id: text
      transaction_id: text - links to sales
      product_id: text
      contact_at: timestamp
      channel: text
      transcript_text: text
      issue_category: text - agent's tag (noisy)
      agent_id: text - links to agents
      first_response_minutes: integer - minutes until the first agent reply
      resolved_at: timestamp
      csat: number - customer satisfaction 1-5 (may be empty)
      resolution_status: text
joins:
- sales.product_id = product_master.product_id
- sales.sku_id = product_skus.sku_id
- sales.customer_id = customers.customer_id
- sales.address_id = customer_addresses.address_id
- sales.campaign_id = campaigns.campaign_id
- sales.event_id = sale_events.event_id
- sales.seller_id = sellers.seller_id
- sales.warehouse_id = warehouses.warehouse_id
- sales.coupon_code = promotions.code
- sales.order_id = marketing_attribution.order_id
- sales.transaction_id = product_reviews.transaction_id
- sales.transaction_id = support_contacts.transaction_id
- product_skus.product_id = product_master.product_id
- product_reviews.product_id = product_master.product_id
- support_contacts.product_id = product_master.product_id
- inventory_history.product_id = product_master.product_id
- inventory_live.product_id = product_master.product_id
- product_master.seller_id = sellers.seller_id
- clickstream.session_id = sales.session_id
- clickstream.customer_id = customers.customer_id
- clickstream.product_id = product_master.product_id
- clickstream.campaign_id = campaigns.campaign_id
- impressions.page_event_id = clickstream.event_id
- impressions.product_id = product_master.product_id
- campaigns.event_id = sale_events.event_id
- marketing_spend.campaign_id = campaigns.campaign_id
- marketing_plan.campaign_id = campaigns.campaign_id
- marketing_attribution.campaign_id = campaigns.campaign_id
- inventory_history.sku_id = product_skus.sku_id
- inventory_live.sku_id = product_skus.sku_id
- price_history.product_id = product_master.product_id
- price_history.event_id = sale_events.event_id
- promotions.event_id = sale_events.event_id
- support_contacts.agent_id = agents.agent_id
- customers.customer_id = customer_addresses.customer_id
- auth_events.customer_id = customers.customer_id
blocked:
  tables:
    crm_sends: control-group rows have no send time, so CRM uplift cannot be measured
    purchase_orders: initial purchase orders are always recorded 2 days late
    customer_pii: personal data
  columns:
    customer_addresses.address_line: street address (personal data)
    support_contacts.issue_bucket_true: simulator ground truth, not known to a real shop
