  - id: y09
    expect: answer
    difficulty: hard
    question: What is the gross margin for each product usage type such as casual, formal and sports?
    intent: profitability by usage
    required_tables: [sales, product_master]
    required_metrics: [gross_margin_pct]
    required_joins: [sales.product_id = product_master.product_id]
    filter_values: []
    result_grain: one row per usage
    key_columns: [usage]
    metric_columns: [gross_margin_pct]
    gold_sql: |
      SELECT p.usage,
             SUM(CASE WHEN s.delivered_at IS NOT NULL AND s.refunded_at IS NULL
                 THEN s.net_amount - s.tax_amount - s.shipping_fee - s.unit_cost * s.quantity END)
           / SUM(CASE WHEN s.delivered_at IS NOT NULL AND s.refunded_at IS NULL
                 THEN s.net_amount - s.tax_amount - s.shipping_fee END) AS gross_margin_pct
      FROM sales s JOIN product_master p ON p.product_id = s.product_id
      WHERE s.line_type = 'Sale' GROUP BY 1

