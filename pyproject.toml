[project]
name = "pantree-insights"
version = "0.1.0"
description = "Verified AI data analyst for Pantree, a simulated Indian fashion shop: question -> confirmed spec -> compiled SQL -> insight."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "duckdb>=1.1",
    "pandas>=2.2",
    "pyarrow>=17",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "pyyaml>=6.0",
    "sqlglot>=25.0",
    "huggingface_hub>=0.24",
    "langchain>=1.5.0",
    "langchain-openai>=1.8.0",
    "langgraph>=1.2.22",
    "langgraph-checkpoint-postgres>=3.0.0",
    "plotly>=7.1.0",
    "fastapi>=0.162.7",
    "uvicorn[standard]>=0.54.0",
    "sqlalchemy>=2.1.8",
    "psycopg[binary]>=3.3.9",
    "authlib>=1.9.5",
    "itsdangerous>=2.2.0",
    "httpx>=0.28.1",
    "onnxruntime>=1.20,<2",
    "tokenizers>=0.21,<1",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[project.scripts]
pantree-data = "pantree_insights.db:main"
pantree-pulse = "pantree_insights.pulse:main"
pantree-profile = "pantree_insights.profile:main"
pantree-catalog = "pantree_insights.catalog:main"
pantree-ask = "pantree_insights.graph:main"
pantree-web = "pantree_insights.web:main"
pantree-demo = "pantree_insights.demos:main"
pantree-knowledge = "pantree_insights.retrieval:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pantree_insights"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["SIM905"]   # "a b c".split() reads better for word lists

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["data: needs the downloaded simulator data (small size)"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.params.Depends"]   # standard FastAPI dependency style
