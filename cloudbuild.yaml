# Continuous deployment: a Cloud Build trigger runs this on every push to main
# (set up once in the console, see README "Automatic deploys").
# Builds the image, pushes it to Artifact Registry and rolls it out to the existing
# Cloud Run service. Secrets, the mounted data bucket, environment variables, scaling and
# the service account stay as scripts/deploy_cloudrun.sh configured them; only the image changes.
substitutions:
  _REGION: us-central1
  _SERVICE: pantree-insights
  _REPO: pantree
  _IMAGE: ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/app:${SHORT_SHA}

steps:
  - id: build
    name: gcr.io/cloud-builders/docker
    args: ["build", "-t", "${_IMAGE}", "."]

  - id: push
    name: gcr.io/cloud-builders/docker
    args: ["push", "${_IMAGE}"]

  - id: deploy
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: gcloud
    args: ["run", "deploy", "${_SERVICE}", "--image", "${_IMAGE}", "--region", "${_REGION}", "--quiet"]

images: ["${_IMAGE}"]

# Installing dependencies and downloading the embedding model can exceed the 10-minute default.
timeout: 1800s
options:
  dynamicSubstitutions: true
  logging: CLOUD_LOGGING_ONLY
